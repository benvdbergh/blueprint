# CI for the `blueprint` installer (bin/, cli/, test/). Projects never get this file.
name: "Package · installer tests"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Pack and run the packed installer
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          tarball=$(ls "$RUNNER_TEMP"/product-blueprint-*.tgz)
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npx --yes --package="$tarball" -- blueprint init --yes --providers claude,cursor,copilot,gemini,lovable
          test -f blueprint/workflows/sync.md && test -f AGENTS.md && test -f blueprint/.install.json
          test ! -e .github/workflows && test ! -e scripts && test ! -e governance
          npx --yes --package="$tarball" -- blueprint upgrade --yes
