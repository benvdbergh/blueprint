# CI for the `blueprint init` installer (bin/, cli/, test/). This file belongs to this repository only:
# the installer never copies .github/workflows/package-*.yml into projects.
name: "Package · installer tests"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Pack and run the packed installer
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          tarball=$(ls "$RUNNER_TEMP"/product-blueprint-*.tgz)
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npx --yes --package="$tarball" -- blueprint init --yes --providers claude,cursor,copilot,gemini,lovable
          npx --yes --package="$tarball" -- blueprint check
          npx --yes --package="$tarball" -- blueprint new feature "Smoke test"
          npx --yes --package="$tarball" -- blueprint check blueprint
          test ! -e .github/workflows/package-ci.yml && test ! -e scripts && test ! -e templates
          # --vendor: the copy in .blueprint/ runs without the package
          mkdir -p "$RUNNER_TEMP/vendor" && cd "$RUNNER_TEMP/vendor"
          npx --yes --package="$tarball" -- blueprint init --yes --vendor
          node .blueprint/bin/blueprint.mjs check
