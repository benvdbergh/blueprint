# WF-05 · governance half of the hard gate: blueprint structure, protected specs, impact analysis,
# traceability and terminology. Required status check: "governance-gate".
# Runs on PR edits and label changes too, because the impact table lives in the PR body and
# approvals are expressed as labels.
name: "WF-05 · Governance gate"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: wf05-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-gate:
    name: governance-gate
    if: vars.WF05_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-blueprint
      - name: Blueprint structure
        run: $BLUEPRINT check blueprint
      - name: Protected specifications
        if: always()
        run: $BLUEPRINT check protected
      - name: Impact analysis
        if: always()
        id: impact
        run: $BLUEPRINT check impact
      - name: Requirements ↔ tests traceability
        if: always()
        run: $BLUEPRINT check trace
      - name: Terminology
        if: always()
        run: $BLUEPRINT check terminology
      - name: Triggered workflows
        if: always() && steps.impact.outputs.workflows != ''
        run: echo "::notice::This change is relevant to ${{ steps.impact.outputs.workflows }}"
