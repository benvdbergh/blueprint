# WF-06 · Blueprint Synchronization — after every merge to main, propose precise blueprint updates.
# Claude only edits files. Deterministic steps then check which paths changed (ownership model),
# commit to a branch and open a PR for human review. Nothing is ever pushed to main.
name: "WF-06 · Blueprint sync"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      range:
        description: "Commit range to analyse (e.g. abc123..def456). Default: the last commit."
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: wf06-blueprint-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.WF06_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GOVERNANCE_BOT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GOVERNANCE_BOT_TOKEN || github.token }}
      - id: precheck
        uses: ./.github/actions/ai-precheck
        with:
          workflow: WF-06
          enabled-var: ${{ vars.WF06_ENABLED }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Determine range and skip conditions
        id: range
        env:
          INPUT_RANGE: ${{ inputs.range }}
          BEFORE: ${{ github.event.before }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -n "$INPUT_RANGE" ]; then range="$INPUT_RANGE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then range="$BEFORE..$GITHUB_SHA"
          else range="HEAD~1..HEAD"; fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "$range" | sed -E 's/([0-9a-f]{7})[0-9a-f]*/\1/g')" >> "$GITHUB_OUTPUT"
          skip=false
          if echo "$HEAD_MSG" | grep -qE '\[skip blueprint-sync\]|blueprint-sync/'; then skip=true; echo "::notice::Commit comes from a blueprint sync; skipping."; fi
          non_blueprint=$(git diff --name-only "$range" | grep -v '^blueprint/' | grep -v '^\.governance-out/' || true)
          if [ -z "$non_blueprint" ] && [ -z "$INPUT_RANGE" ]; then skip=true; echo "::notice::Only blueprint files changed; nothing to sync."; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          mkdir -p .governance-out

      - name: Claude · WF-06 blueprint sync
        if: steps.precheck.outputs.run == 'true' && steps.range.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GOVERNANCE_BOT_TOKEN || github.token }}
          prompt: |
            Follow the instructions in `.claude/commands/wf06-blueprint-sync.md` exactly.
            Range: ${{ steps.range.outputs.range }}

            CI context — overrides the "Result" step of that file:
            - Do NOT commit, push or open PRs yourself. Only edit files under `blueprint/`.
            - Write the full PR body to `.governance-out/pr-body.md`.
            - Write a 3–8 line summary to `.governance-out/summary.md` (also when nothing needs changing).
            - A later deterministic step verifies which files you changed against the ownership model
              and rejects the whole proposal if you touched a file WF-06 may not change.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(node scripts/governance/check-blueprint.mjs),Bash(node scripts/governance/terminology.mjs)"
            ${{ vars.CLAUDE_MODEL && format('--model {0}', vars.CLAUDE_MODEL) || '' }}

      - name: Guard · ownership model
        if: steps.precheck.outputs.run == 'true' && steps.range.outputs.skip != 'true'
        id: guard
        run: node scripts/governance/guard-paths.mjs --workflow WF-06

      - name: Validate blueprint
        if: steps.guard.outputs.changed != '0' && steps.guard.outcome == 'success'
        run: node scripts/governance/check-blueprint.mjs

      - name: Open blueprint sync PR
        if: steps.guard.outputs.changed != '0' && steps.guard.outcome == 'success'
        env:
          RANGE: ${{ steps.range.outputs.range }}
          SHORT: ${{ steps.range.outputs.short }}
        run: |
          branch="blueprint-sync/${GITHUB_SHA::7}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "blueprint-sync[bot]"
          git config user.email "blueprint-sync[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add blueprint/
          git commit -m "docs(blueprint): sync $SHORT [skip blueprint-sync]"
          git push -u origin "$branch"
          for l in blueprint-sync ai-proposal; do gh label create "$l" --color 5319E7 2>/dev/null || true; done
          [ -s .governance-out/pr-body.md ] || echo "Blueprint sync for $RANGE (no PR body was produced)." > .governance-out/pr-body.md
          gh pr create --base main --head "$branch" --title "WF-06: blueprint sync for $SHORT" \
            --label blueprint-sync --label ai-proposal --body-file .governance-out/pr-body.md

      - name: Job summary
        if: always()
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          { echo "## WF-06 · Blueprint sync"; echo; echo "Range: \`$RANGE\`"; echo;
            cat .governance-out/summary.md 2>/dev/null || echo "_No AI summary (skipped or not configured)._"; } >> "$GITHUB_STEP_SUMMARY"
