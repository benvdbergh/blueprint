# WF-05 · Code Quality & Implementation Validation — code half of the hard gate.
# Required status check: "quality-gate". Deterministic only; no AI in the gate.
# Each step runs a package.json script from the script contract and skips if it isn't defined
# (governance/README.md#4-script-contract). Add `--required` to make a script mandatory.
name: "WF-05 · Quality gate"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf05-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Lint, types, architecture
    if: vars.WF05_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - name: 1 · Lint & formatting
        run: node scripts/ci/run.mjs lint
      - name: 2 · Type checking
        run: node scripts/ci/run.mjs typecheck
      - name: 8 · Architectural constraints
        run: node scripts/ci/run.mjs check:architecture

  test:
    name: Unit & integration tests
    if: vars.WF05_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - name: 3 · Unit tests
        run: node scripts/ci/run.mjs test
      - name: 4 · Integration tests
        run: node scripts/ci/run.mjs test:integration

  e2e:
    name: End-to-end tests
    if: vars.WF05_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - id: has
        run: node -e "const s=(()=>{try{return require('./package.json').scripts||{}}catch{return{}}})();console.log('e2e='+!!s['test:e2e'])" >> "$GITHUB_OUTPUT"
      - name: Install Playwright browsers
        if: steps.has.outputs.e2e == 'true' && hashFiles('playwright.config.*') != ''
        run: npx playwright install --with-deps chromium
      - name: 5 · End-to-end tests
        run: node scripts/ci/run.mjs test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  build:
    name: Build
    if: vars.WF05_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - name: 6 · Build validation
        run: node scripts/ci/run.mjs build

  security:
    name: Dependency & security scan
    if: vars.WF05_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup-project
        with:
          install: "false"
      - name: 7 · Dependency audit (high and critical)
        if: steps.setup.outputs.has_package_json == 'true'
        env:
          PM: ${{ steps.setup.outputs.package_manager }}
        run: |
          case "$PM" in
            npm)  if [ -f package-lock.json ]; then npm audit --audit-level=high --omit=dev; else echo "::warning::No package-lock.json; npm audit skipped. Commit your lockfile."; fi ;;
            pnpm) pnpm audit --audit-level high --prod ;;
            yarn) yarn npm audit --severity high --environment production || yarn audit --level high --groups dependencies ;;
            bun)  bun audit --audit-level=high || echo "::warning::bun audit unavailable in this Bun version" ;;
          esac
      - name: Dependency review (new vulnerable or disallowed dependencies in this PR)
        # Needs the dependency graph (public repos, or private repos with GitHub Advanced Security).
        if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  quality-gate:
    name: quality-gate
    if: always()
    needs: [static, test, e2e, build, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: governance/config.json
          sparse-checkout-cone-mode: false
      - name: Evaluate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "Job results: $RESULTS"
          # governance/config.json "enforcement": "report" lets a repository adopt the gate without blocking.
          # In a PR the mode comes from the base branch, so a PR can't switch its own gate to report mode.
          config=$(cat governance/config.json 2>/dev/null || echo '{}')
          if [ -n "$BASE_SHA" ] && git fetch -q --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            base=$(git show "$BASE_SHA:governance/config.json" 2>/dev/null) && config="$base"
          fi
          MODE=$(printf '%s' "$config" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).enforcement||'enforce')}catch{console.log('enforce')}})")
          echo "Enforcement mode: $MODE"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              if [ "$MODE" = "report" ]; then
                echo "::warning::[report-only] The quality gate would fail. Set \"enforcement\": \"enforce\" in governance/config.json once it is green."; exit 0
              fi
              echo "::error::Quality gate failed. Fix the failing checks; don't bypass them (AGENTS.md §4.6)."; exit 1
            fi
          done
          echo "Quality gate passed."

  report-main-failure:
    # Direct commits to main (e.g. from Lovable) skip PR checks. Make a red main visible.
    if: failure() && github.event_name == 'push'
    needs: [quality-gate]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          gh label create quality-gate-failure --color B60205 --description "WF-05 failed on main" 2>/dev/null || true
          existing=$(gh issue list --label quality-gate-failure --state open --json number --jq '.[0].number')
          body="WF-05 failed on \`main\` at ${SHA} (pushed by ${ACTOR}).\n\nRun: ${RUN_URL}"
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$(printf "$body")";
          else gh issue create --title "Quality gate failing on main" --label quality-gate-failure --body "$(printf "$body")"; fi
