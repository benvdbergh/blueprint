# WF-04 · API & Integration Contract Synchronization — OpenAPI lint, breaking-change detection,
# generated-spec drift and contract tests. Breaking changes need the `api:breaking-approved` label.
name: "WF-04 · API contract"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "contracts/**"
      - "supabase/functions/**"
      - "api/**"
      - "src/api/**"
      - "server/**"
      - "functions/**"

permissions:
  contents: read

concurrency:
  group: wf04-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    name: api-contract
    if: vars.WF04_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPEC: contracts/openapi.yaml
      BREAKING_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'api:breaking-approved') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - id: spec
        run: |
          if [ -f "$SPEC" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "::notice::No $SPEC yet; OpenAPI checks skipped."; fi
          if git cat-file -e "origin/$GITHUB_BASE_REF:$SPEC" 2>/dev/null; then echo "base=true" >> "$GITHUB_OUTPUT"; else echo "base=false" >> "$GITHUB_OUTPUT"; fi

      - name: 1/3 · Spec in sync with code (check:openapi)
        run: node scripts/ci/run.mjs check:openapi
      - name: 4 · Validate schema (Redocly)
        if: steps.spec.outputs.exists == 'true'
        run: npx --yes @redocly/cli@1 lint "$SPEC" --format=github-actions

      - name: 5 · Breaking changes (oasdiff)
        if: steps.spec.outputs.exists == 'true' && steps.spec.outputs.base == 'true'
        run: |
          mkdir -p .governance-out
          git show "origin/$GITHUB_BASE_REF:$SPEC" > .governance-out/base-openapi.yaml
          docker run --rm -v "$PWD:/w" -w /w tufin/oasdiff:latest changelog .governance-out/base-openapi.yaml "$SPEC" > .governance-out/changelog.txt || true
          set +e
          docker run --rm -v "$PWD:/w" -w /w tufin/oasdiff:latest breaking .governance-out/base-openapi.yaml "$SPEC" --fail-on ERR > .governance-out/breaking.txt
          status=$?
          set -e
          { echo "## WF-04 · API changes"; echo '```'; cat .governance-out/changelog.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            cat .governance-out/breaking.txt
            { echo "### ⚠️ Breaking changes"; echo '```'; cat .governance-out/breaking.txt; echo '```';
              echo "Update consumers listed in blueprint/05-interfaces.md."; } >> "$GITHUB_STEP_SUMMARY"
            if [ "$BREAKING_APPROVED" = "true" ]; then echo "::warning::Breaking API changes approved via label api:breaking-approved."
            else echo "::error::Breaking API changes detected. Make them compatible, or have the API owner add the 'api:breaking-approved' label."; exit 1; fi
          fi

      - name: 6 · Contract tests (test:contract)
        run: node scripts/ci/run.mjs test:contract
