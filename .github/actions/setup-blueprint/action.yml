name: Set up the blueprint CLI
description: Sets up Node and puts the pinned product-blueprint CLI in $BLUEPRINT for the later steps of the job.
# The governance checks, prompts and docs come from the product-blueprint package instead of copies in the
# repository. Every workflow calls them as `$BLUEPRINT <command>` (or `${{ env.BLUEPRINT }}` in `with:`).
# Which CLI, in order:
#   1. a vendored copy in .blueprint/ (`blueprint init --vendor`): no npm access needed
#   2. the product-blueprint repository itself (it tests its own checks)
#   3. the pinned npm version below. `blueprint upgrade` rewrites the version.
inputs:
  node-version:
    description: Node.js version
    default: "22"
  setup-node:
    description: Set up Node (false when the job already did)
    default: "true"
runs:
  using: composite
  steps:
    - if: inputs.setup-node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - shell: bash
      run: |
        if [ -f .blueprint/bin/blueprint.mjs ]; then cli="node .blueprint/bin/blueprint.mjs"
        elif [ -f bin/blueprint.mjs ] && grep -q '"name": "product-blueprint"' package.json 2>/dev/null; then cli="node bin/blueprint.mjs"
        else cli="npx product-blueprint@0.3.0"; echo "npm_config_yes=true" >> "$GITHUB_ENV"; export npm_config_yes=true; fi
        echo "BLUEPRINT=$cli" >> "$GITHUB_ENV"
        echo "Blueprint CLI: $cli ($($cli --version))"
