name: Setup project
description: Sets up the blueprint CLI ($BLUEPRINT), detects the package manager, sets up Node (and Bun/pnpm/yarn if needed) and installs dependencies when a package.json exists.
inputs:
  install:
    description: Install dependencies
    default: "true"
  node-version:
    description: Node.js version
    default: "22"
outputs:
  package_manager:
    description: npm | pnpm | yarn | bun
    value: ${{ steps.detect.outputs.package_manager }}
  has_package_json:
    description: "true when the repository has a package.json"
    value: ${{ steps.detect.outputs.has_package_json }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
    - uses: ./.github/actions/setup-blueprint
      with:
        setup-node: "false"
    - id: detect
      shell: bash
      run: $BLUEPRINT run --detect
    - if: steps.detect.outputs.package_manager == 'pnpm' || steps.detect.outputs.package_manager == 'yarn'
      shell: bash
      run: corepack enable
    - if: steps.detect.outputs.package_manager == 'bun'
      uses: oven-sh/setup-bun@v2
    - if: inputs.install == 'true' && steps.detect.outputs.has_package_json == 'true'
      shell: bash
      run: $BLUEPRINT run --install
