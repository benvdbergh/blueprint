name: AI workflow precheck
description: Decides whether an AI workflow can run (workflow enabled + Claude credentials present). Skips with a notice instead of failing.
inputs:
  workflow:
    description: Workflow id, e.g. WF-06
    required: true
  enabled-var:
    description: Value of the vars.WF0x_ENABLED variable
    default: ""
  api-key:
    description: secrets.ANTHROPIC_API_KEY
    default: ""
outputs:
  run:
    description: "true when the AI step should run"
    value: ${{ steps.check.outputs.run }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        ENABLED: ${{ inputs.enabled-var }}
        KEY: ${{ inputs.api-key }}
        WF: ${{ inputs.workflow }}
      run: |
        if [ "$ENABLED" = "false" ]; then
          echo "::notice::$WF is disabled (repository variable set to false)."; echo "run=false" >> "$GITHUB_OUTPUT"
        elif [ -z "$KEY" ]; then
          echo "::notice::$WF skipped: secret ANTHROPIC_API_KEY is not set (see governance/README.md#7-secrets-variables-and-labels)."; echo "run=false" >> "$GITHUB_OUTPUT"
        else
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi
