name: Feature request
description: Propose a new feature or a change to an existing one (starts WF-01)
title: "[Feature] "
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        This starts **WF-01 · Product & Feature Definition**. A maintainer adds the `wf-01:define` label to have an agent draft a feature spec for approval. No code is written until the spec is approved.
  - type: textarea
    id: problem
    attributes:
      label: Problem / user story
      description: Who needs what, and why? "As a … I want … so that …"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What is different for the user when this exists? How would we know it works?
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related features
      description: Existing FEAT-nnn this extends or touches, if known
  - type: textarea
    id: constraints
    attributes:
      label: Constraints, designs, examples
      description: Screenshots, sketches, prototype links, deadlines
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options: [Now, Next, Later]
