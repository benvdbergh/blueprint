name: Blueprint change proposal
description: Propose a change to product intent (required for 00 Product Core and approved specs)
title: "[Blueprint] "
labels: ["blueprint-proposal"]
body:
  - type: dropdown
    id: document
    attributes:
      label: Document
      options: ["00 Product Core", "01 Product", "02 UX & Design", "03 Domain & Data", "04 Architecture", "05 Interfaces", "06 Deployment", "07 Roadmap", "Feature spec (FEAT-nnn)"]
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: Current text → proposed text, or a description of the change
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason and evidence
      description: What triggered this (PR, drift report finding, user feedback, decision)?
    validations:
      required: true
