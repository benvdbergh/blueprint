# Starter OpenAPI document (`npx product-blueprint@0.3.0 new openapi` writes it to contracts/openapi.yaml). Add it when the first API endpoint exists.
openapi: 3.1.0
info:
  title: Product API
  version: 0.1.0
  description: Intent and consumers are described in blueprint/05-interfaces.md.
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
